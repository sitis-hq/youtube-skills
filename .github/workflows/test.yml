name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The same pins the platform shelf delivers to a run; a test that passes on other versions
      # proves nothing about the run.
      - run: python -m pip install opencv-python-headless==4.14.0.94 numpy==2.2.6
      - run: python run_tests.py -v
